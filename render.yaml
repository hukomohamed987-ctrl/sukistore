services:
  - type: web
    name: souqi-store-demo
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_DRIVER
        value: sqlite
      - key: DEMO_READ_ONLY
        value: "true"
      - key: SQLITE_BACKUP_HOURS
        value: "0"
      - key: JWT_SECRET
        generateValue: true
